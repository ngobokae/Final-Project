services:
  mysql:
    image: mysql:8.0
    container_name: manufacturing-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Jtesire74!
      MYSQL_DATABASE: manufacturing_system
    ports:
      - "3307:3306"  # host 3307 — avoids conflict with local MySQL on 3306
    volumes:
      - db_data:/var/lib/mysql
      - ./Manaf1.sql:/docker-entrypoint-initdb.d/Manaf1.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pJtesire74!"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend/backend
    container_name: manufacturing-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      PORT: "3001"
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: Jtesire74!
      DB_NAME: manufacturing_system
      JWT_SECRET: manufacturing-system-secret-key-2024
      FRONTEND_URL: http://localhost:5173
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend/frontend
    container_name: manufacturing-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:3001
    ports:
      - "5173:5173"

  ml-service:
    build:
      context: ./ml-service/ml-service
    container_name: manufacturing-ml
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/ml-service:/app
    environment:
      PYTHONUNBUFFERED: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1,ml-service,manufacturing-ml,backend,manufacturing-backend,backend2"

volumes:
  db_data:
